include:
  - "$SERVICE_PATH/values.yaml"
trace:
  title: Roll back deployment
  job:
    name: lambda-deployment-rollback
    namespace: "@context:scope.provider"
    labels:
      entity: deployment
      operation: rollback
      scope.provider: "@context:scope.provider"
steps:
  - name: load_logging
    type: script
    file: "$SERVICE_PATH/utils/log"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume_role
    trace: false
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build_context
    trace: false
    type: script
    file: "$SERVICE_PATH/deployment/build_context"
    output:
      - name: SCOPE_ID
        type: environment
      - name: DEPLOYMENT_ID
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: LAMBDA_FUNCTION_NAME
        type: environment
      - name: LAMBDA_MAIN_ALIAS_NAME
        type: environment
      - name: LAMBDA_CURRENT_VERSION
        type: environment
      - name: LAMBDA_GREEN_VERSION
        type: environment
      - name: LAMBDA_BLUE_VERSION
        type: environment
      - name: BLUE_DEPLOYMENT_ID
        type: environment
  - name: restore_alias
    trace:
      title: Restore traffic to the previous version
    type: script
    file: "$SERVICE_PATH/deployment/scripts/rollback_alias"
  - name: cleanup_new_version
    trace:
      title: Remove the new version
    type: script
    file: "$SERVICE_PATH/deployment/scripts/cleanup_new_version"
