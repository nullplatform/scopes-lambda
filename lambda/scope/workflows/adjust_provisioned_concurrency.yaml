include:
  - "$SERVICE_PATH/values.yaml"
trace:
  title: Adjust provisioned concurrency
  job:
    name: lambda-scope-adjust-provisioned-concurrency
    namespace: "@context:scope.provider"
    labels:
      entity: scope
      operation: adjust-provisioned-concurrency
      scope.provider: "@context:scope.provider"
steps:
  - name: load_logging
    type: script
    file: "$SERVICE_PATH/utils/log"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume_role
    trace: false
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build_context
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/build_context"
    output:
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_SLUG
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: NAMESPACE_SLUG
        type: environment
      - name: APPLICATION_SLUG
        type: environment
      - name: ACCOUNT_SLUG
        type: environment
      - name: LAMBDA_FUNCTION_NAME
        type: environment
      - name: OUTPUT_DIR
        type: environment
  - name: adjust_provisioned_concurrency
    trace:
      title: Adjust provisioned concurrency
    type: script
    file: "$SERVICE_PATH/scope/scripts/adjust_provisioned_concurrency"
