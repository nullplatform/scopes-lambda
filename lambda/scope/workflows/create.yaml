include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  TOFU_ACTION: "apply"
trace:
  title: Create scope
  job:
    name: lambda-scope-create
    namespace: "@context:scope.provider"
    labels:
      entity: scope
      operation: create
      scope.provider: "@context:scope.provider"
steps:
  - name: load_logging
    type: script
    file: "$SERVICE_PATH/utils/log"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume_role
    trace: false
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build_context
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/build_context"
    output:
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_SLUG
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: NAMESPACE_SLUG
        type: environment
      - name: APPLICATION_SLUG
        type: environment
      - name: ACCOUNT_SLUG
        type: environment
      - name: LAMBDA_FUNCTION_NAME
        type: environment
      - name: VISIBILITY
        type: environment
      - name: PACKAGE_TYPE
        type: environment
      - name: ASSET_TYPE
        type: environment
      - name: RUNTIME
        type: environment
      - name: HANDLER
        type: environment
      - name: ARCHITECTURE
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: RESOURCE_TAGS_JSON
        type: environment
  - name: resolve_placeholder_image
    trace:
      title: Resolve the placeholder image
    type: script
    file: "$SERVICE_PATH/scope/scripts/resolve_placeholder_image"
    output:
      - name: IMAGE_URI
        type: environment
      - name: LAMBDA_FILENAME
        type: environment
  - name: build_tofu_context
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/tofu/build_context"
    output:
      - name: TF_WORKING_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
      - name: CONTEXT
        type: environment
      - name: LAMBDA_MAIN_ALIAS_NAME
        type: environment
  - name: setup_provider
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/tofu/provider/aws/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: setup_iam
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/tofu/iam/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
      - name: CONTEXT
        type: environment
  - name: setup_compute
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/tofu/compute/lambda/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: compose_modules
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/tofu/compose_modules"
  - name: tofu
    trace:
      title: Apply infrastructure
    type: script
    file: "$SERVICE_PATH/scope/tofu/do_tofu"
    output:
      - name: LAMBDA_FUNCTION_ARN
        type: environment
      - name: LAMBDA_CURRENT_VERSION
        type: environment
      - name: ALB_RULE_ARN
        type: environment
      - name: LAMBDA_ALIAS_ARN
        type: environment
      - name: LAMBDA_EXECUTION_ROLE_ARN
        type: environment
      - name: LAMBDA_EXECUTION_ROLE_NAME
        type: environment
  - name: sync_invoke_permissions
    trace:
      title: Sync invoke permissions
    type: script
    file: "$SERVICE_PATH/scope/scripts/sync_invoke_permissions"
  - name: sync_dead_letter_queue
    trace:
      title: Sync the dead-letter queue
    type: script
    file: "$SERVICE_PATH/scope/scripts/sync_dead_letter_queue"
  - name: store_metadata
    trace:
      title: Save scope metadata
    type: script
    file: "$SERVICE_PATH/scope/scripts/store_nrn_metadata"
