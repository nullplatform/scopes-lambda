include:
  - "$SERVICE_PATH/values.yaml"
trace:
  title: Update scope
  job:
    name: lambda-scope-update
    namespace: "@context:scope.provider"
    labels:
      entity: scope
      operation: update
      scope.provider: "@context:scope.provider"
steps:
  - name: load_logging
    type: script
    file: "$SERVICE_PATH/utils/log"
    trace: false
    output:
      - name: log
        type: function
        parameters:
          level: string
          message: string
  - name: assume_role
    trace: false
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build_context
    trace: false
    type: script
    file: "$SERVICE_PATH/scope/build_context"
    output:
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_SLUG
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: LAMBDA_FUNCTION_NAME
        type: environment
  - name: update_iam
    trace:
      title: Update the IAM role
    type: script
    file: "$SERVICE_PATH/scope/scripts/update_iam_role"
  - name: sync_invoke_permissions
    trace:
      title: Sync invoke permissions
    type: script
    file: "$SERVICE_PATH/scope/scripts/sync_invoke_permissions"
  - name: sync_dead_letter_queue
    trace:
      title: Sync the dead-letter queue
    type: script
    file: "$SERVICE_PATH/scope/scripts/sync_dead_letter_queue"
  - name: store_metadata
    trace:
      title: Save scope metadata
    type: script
    file: "$SERVICE_PATH/scope/scripts/store_nrn_metadata"
