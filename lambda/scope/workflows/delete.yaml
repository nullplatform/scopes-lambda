include:
  - "$SERVICE_PATH/values.yaml"
configuration:
  TOFU_ACTION: "destroy"
steps:
  - name: assume_role
    type: script
    file: "$SERVICE_PATH/utils/assume_role_step"
    output:
      - name: AWS_ACCESS_KEY_ID
        type: environment
      - name: AWS_SECRET_ACCESS_KEY
        type: environment
      - name: AWS_SESSION_TOKEN
        type: environment
  - name: build_context
    type: script
    file: "$SERVICE_PATH/scope/build_context"
    output:
      - name: SCOPE_ID
        type: environment
      - name: SCOPE_NRN
        type: environment
      - name: LAMBDA_FUNCTION_NAME
        type: environment
      - name: OUTPUT_DIR
        type: environment
      - name: RESOURCE_TAGS_JSON
        type: environment
      - name: VISIBILITY
        type: environment
      - name: NETWORKING_MODE
        type: environment
      - name: ALB_PUBLIC_LISTENER_ARNS
        type: environment
      - name: ALB_PRIVATE_LISTENER_ARNS
        type: environment
      - name: HOSTED_PUBLIC_ZONE_ID
        type: environment
      - name: HOSTED_PRIVATE_ZONE_ID
        type: environment
      - name: AWS_REGION
        type: environment
      - name: TOFU_STATE_BUCKET
        type: environment
      - name: TOFU_STATE_BUCKET_REGION
        type: environment
  - name: build_networking_context
    type: script
    file: "$SERVICE_PATH/scope/tofu/networking/build_context"
    output:
      - name: NETWORKING_MODE
        type: environment
      - name: TF_WORKING_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: STATE_KEY
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
      - name: LAMBDA_MAIN_ALIAS_NAME
        type: environment
  - name: setup_networking_provider
    type: script
    file: "$SERVICE_PATH/scope/tofu/provider/aws/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: compose_networking_modules
    type: script
    file: "$SERVICE_PATH/scope/tofu/compose_modules"
  - name: apply_networking
    type: script
    file: "$SERVICE_PATH/scope/scripts/apply_networking"
    output:
      - name: ALB_RULE_PRIORITY
        type: environment
  - name: build_destroy_context
    type: script
    file: "$SERVICE_PATH/scope/scripts/build_destroy_context"
    output:
      - name: TF_WORKING_DIR
        type: environment
      - name: TOFU_MODULE_DIR
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
      - name: CONTEXT
        type: environment
      - name: PACKAGE_TYPE
        type: environment
      - name: IMAGE_URI
        type: environment
      - name: S3_BUCKET
        type: environment
      - name: S3_KEY
        type: environment
  - name: setup_provider
    type: script
    file: "$SERVICE_PATH/scope/tofu/provider/aws/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: TOFU_INIT_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: setup_iam
    type: script
    file: "$SERVICE_PATH/scope/tofu/iam/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: setup_compute
    type: script
    file: "$SERVICE_PATH/scope/tofu/compute/lambda/setup"
    output:
      - name: TOFU_VARIABLES
        type: environment
      - name: MODULES_TO_USE
        type: environment
  - name: cleanup_role_inline_policies
    type: script
    file: "$SERVICE_PATH/scope/scripts/cleanup_role_inline_policies"
  - name: compose_modules
    type: script
    file: "$SERVICE_PATH/scope/tofu/compose_modules"
  - name: tofu
    type: script
    file: "$SERVICE_PATH/scope/tofu/do_tofu"
  - name: delete_sm_secrets
    type: script
    file: "$SERVICE_PATH/scope/scripts/delete_sm_secret"
  - name: publish_alb_metrics
    type: script
    file: "$SERVICE_PATH/scope/scripts/publish_alb_metrics"
