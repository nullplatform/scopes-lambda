name: release

# Full release pipeline in ONE chained run: release-please -> docker build+push
# to ECR Public -> np artifact registration -> release finalized with the
# artifact metadata (image, digest, pinned reference, artifact id) and
# force-published.
#
# Chained on purpose: release-please creates tags with GITHUB_TOKEN, and
# GitHub never triggers workflows from bot-token events — a separate
# `on: push: tags` publish workflow does not fire (and the delete/re-push
# workaround flips the release to Draft).
#
# Recovery / backfill: run this workflow manually with existing_tag to
# publish + finalize a tag that already exists (a release whose publish
# failed, or a pre-pipeline tag with no artifact metadata).
#
# Then publish-package publishes the scope as a package visible to every
# organization (lambda/publish), pinned to the image digest just pushed. It
# needs secrets PACKAGE_NP_API_KEY (publisher organization key allowed to write
# specs, scope types and packages) + AWS_ROLE_ARN_PUBLISH_STATE (OIDC role for
# the tofu state bucket) and variables PUBLISH_TFSTATE_BUCKET +
# PUBLISH_TFSTATE_REGION + NP_ARTIFACT_NRN; it is skipped until
# PUBLISH_TFSTATE_BUCKET is set.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      existing_tag:
        description: 'Publish + finalize an existing tag (recovery/backfill)'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write   # OIDC auth against AWS for the ECR push

jobs:
  release:
    uses: nullplatform/actions-nullplatform/.github/workflows/release-publish-oci.yml@v1
    with:
      image_name: scopes/lambda
      # Same behavior as the previous release.yml caller (shared defaults).
      release-type: terraform-module
      update_readme_versions: true
      existing_tag: ${{ inputs.existing_tag || '' }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}

  publish-package:
    name: Publish package
    needs: release
    if: ${{ !cancelled() && needs.release.outputs.image_digest != '' && vars.PUBLISH_TFSTATE_BUCKET != '' }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: lambda/publish
    env:
      TAG: ${{ needs.release.outputs.tag_name }}
      GOMPLATE_VERSION: v5.0.0
      # Only the latest np CLI is publicly downloadable; the step logs the
      # version it got.
      NP_CLI_VERSION: latest
    # Third-party actions are pinned by SHA (Dependabot keeps them current) and
    # the publisher API key is scoped to the Apply step: no setup action sees it.
    steps:
      # The package must publish the templates of the released tag, not of main.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release.outputs.tag_name }}

      - name: Check the stack publishes the tag
        run: |
          RELEASE="$(sed -n 's/^ *release *= *"\(v[0-9][^"]*\)".*/\1/p' versions.tf)"
          if [ "${RELEASE}" != "${TAG}" ]; then
            echo "::error::lambda/publish/versions.tf releases ${RELEASE:-nothing} but the tag is ${TAG}"
            exit 1
          fi

      # scope_definition renders the templates with gomplate + jq and patches
      # the NRN with the np CLI.
      - name: Install gomplate and np
        run: |
          curl -fsSL -o /tmp/gomplate "https://github.com/hairyhenderson/gomplate/releases/download/${GOMPLATE_VERSION}/gomplate_linux-amd64"
          curl -fsSL -o /tmp/gomplate.sha256 "https://github.com/hairyhenderson/gomplate/releases/download/${GOMPLATE_VERSION}/checksums-${GOMPLATE_VERSION}_sha256.txt"
          (cd /tmp && grep '/gomplate_linux-amd64$' gomplate.sha256 | sed 's|  .*$|  gomplate|' | sha256sum -c -)
          sudo install -m 0755 /tmp/gomplate /usr/local/bin/gomplate
          curl -fsSL https://cli.nullplatform.com/install.sh | VERSION="${NP_CLI_VERSION}" sh
          echo "${HOME}/.local/bin" >> "$GITHUB_PATH"
          "${HOME}/.local/bin/np" --version
          gomplate --version
          jq --version

      - name: Configure AWS credentials (tofu state)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN_PUBLISH_STATE }}
          aws-region: ${{ vars.PUBLISH_TFSTATE_REGION }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.1

      - name: Init
        env:
          TFSTATE_BUCKET: ${{ vars.PUBLISH_TFSTATE_BUCKET }}
          TFSTATE_REGION: ${{ vars.PUBLISH_TFSTATE_REGION }}
        run: >-
          tofu init -input=false
          -backend-config="bucket=${TFSTATE_BUCKET}"
          -backend-config="key=scopes-lambda/lambda/publish.tfstate"
          -backend-config="region=${TFSTATE_REGION}"
          -backend-config="use_lockfile=true"

      - name: Apply
        env:
          NULLPLATFORM_API_KEY: ${{ secrets.PACKAGE_NP_API_KEY }}
          TF_VAR_np_api_key: ${{ secrets.PACKAGE_NP_API_KEY }}
          TF_VAR_publisher_nrn: ${{ vars.NP_ARTIFACT_NRN }}
          TF_VAR_image_digest: ${{ needs.release.outputs.image_digest }}
        run: tofu apply -input=false -auto-approve
