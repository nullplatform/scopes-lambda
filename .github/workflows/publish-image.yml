name: publish-image

# Publishes the scope image to ECR Public on every semver tag (created by the
# release workflow). Result: public.ecr.aws/nullplatform/scopes/lambda:<version>
on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for OIDC auth against AWS
  contents: read

jobs:
  publish:
    uses: nullplatform/actions-nullplatform/.github/workflows/docker-build-push-ecr.yml@main
    with:
      image_name: scopes/lambda
      context: .
      tag: ${{ github.ref_name }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
