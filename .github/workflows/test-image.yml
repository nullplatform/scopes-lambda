name: test-image

# Test image from a branch, without cutting a release: builds the branch this
# run is dispatched on, pushes public.ecr.aws/nullplatform/scopes/lambda with
# the tag test-<branch-slug>-<short-sha>, and registers it as a revision of the
# same artifact releases use (owner NP_ARTIFACT_NRN, visible to organization=*),
# annotated com.nullplatform.build.type=test. The run's summary has the image,
# digest, artifact id and revision id to put in a test package version.
#
# Run: Actions > test-image > Run workflow (pick the branch), or
#   gh workflow run test-image.yml --ref <branch>
#
# Configure: nothing beyond release.yml. Same secrets (AWS_ROLE_ARN_ECR_PUSH +
# ARTIFACT_NP_API_KEY) and the same NP_ARTIFACT_NRN variable.
on:
  workflow_dispatch:
    inputs:
      register_artifact:
        description: 'Register the image as a revision of the release artifact (off = image only)'
        required: false
        type: boolean
        default: true
      artifact_visible_to:
        description: 'Visibility selector for the registered artifact (same default as a release)'
        required: false
        type: string
        default: 'organization=*'

permissions:
  contents: read
  id-token: write   # OIDC auth against AWS for the ECR push

jobs:
  test-image:
    uses: nullplatform/actions-nullplatform/.github/workflows/publish-test-image-oci.yml@v1
    with:
      image_name: scopes/lambda
      register_artifact: ${{ inputs.register_artifact }}
      artifact_visible_to: ${{ inputs.artifact_visible_to }}
    secrets:
      aws_role_arn: ${{ secrets.AWS_ROLE_ARN_ECR_PUSH }}
      artifact_np_api_key: ${{ secrets.ARTIFACT_NP_API_KEY }}
